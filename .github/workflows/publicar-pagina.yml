name: Publicar página

# Quando só a página muda (index.html, app.js, tema.js, estilo.css), atualiza o site sem reprocessar a base.
on:
  push:
    branches: [main]
    paths: [index.html, app.js, tema.js, estilo.css]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicacao
  cancel-in-progress: false

jobs:
  pagina:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: main
          persist-credentials: false

      - name: Verificar se a base já foi publicada
        id: gh
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" gh-pages > /dev/null; then echo "existe=true" >> "$GITHUB_OUTPUT"
          else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "A branch gh-pages ainda não existe: rode o workflow 'Atualizar base da Receita' primeiro."; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gh.outputs.existe == 'true'
        with:
          ref: gh-pages
          path: site

      - name: Copiar a página e publicar
        if: steps.gh.outputs.existe == 'true'
        working-directory: site
        run: |
          cp ../main/index.html ../main/app.js ../main/tema.js ../main/estilo.css .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js tema.js estilo.css
          git diff --cached --quiet && { echo "Página sem mudanças."; exit 0; }
          git commit -q -m "Página atualizada"
          git push -q
